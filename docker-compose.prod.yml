services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      args:
        COMPOSER_FLAGS: --no-dev
    image: ${IMAGE_NAME}:latest
    restart: unless-stopped
    env_file: .env.production
    volumes:
      - storage:/var/www/storage
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-network

  worker:
    image: ${IMAGE_NAME}:latest
    restart: unless-stopped
    command: ["su", "-s", "/bin/sh", "www-data", "-c", "php artisan queue:work --sleep=3 --tries=3 --max-time=3600"]
    env_file: .env.production
    volumes:
      - storage:/var/www/storage
    depends_on:
      - app
    networks:
      - app-network

  scheduler:
    image: ${IMAGE_NAME}:latest
    restart: unless-stopped
    command: ["su", "-s", "/bin/sh", "www-data", "-c", "php artisan schedule:work"]
    env_file: .env.production
    volumes:
      - storage:/var/www/storage
    depends_on:
      - app
    networks:
      - app-network

  webserver:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - app-network

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redisdata:/data
    networks:
      - app-network

  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${DB_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  dbdata:
  redisdata:
  storage:
