name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps

    - name: Copy .env file
      run: cp .env.example .env

    - name: Build and start containers
      run: docker compose up -d --build

    - name: Wait for app container to be ready
      run: |
        for i in {1..30}; do
          if docker compose exec -T app php artisan --version; then
            echo "App is ready"
            break
          fi
          echo "Waiting for app..."
          sleep 2
        done

    - name: Generate app key
      run: docker compose exec -T app php artisan key:generate

    - name: Run migrations
      run: docker compose exec -T app php artisan migrate --force

    - name: Run Playwright tests
      run: npx playwright test

    - name: Stop containers
      if: always()
      run: docker compose down

    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
