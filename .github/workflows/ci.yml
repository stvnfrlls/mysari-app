name: Test and Release
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - uses: actions/setup-node@v5
      with:
        node-version: 22
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
    - name: Copy .env file
      run: cp .env.example .env
    - name: Build and start containers
      run: docker compose up -d --build
    - name: Wait for app container to be ready
      run: |
        for i in {1..30}; do
          if docker compose exec -T app php artisan --version; then
            echo "App is ready"
            break
          fi
          echo "Waiting for app..."
          sleep 2
        done
    - name: Install PHP dependencies
      run: docker compose exec -T app composer install --no-interaction --prefer-dist --optimize-autoloader
    - name: Generate app key
      run: docker compose exec -T app php artisan key:generate
    - name: Run migrations
      run: docker compose exec -T app php artisan migrate --force
    - name: Run Playwright tests
      run: npx playwright test
    - name: Stop containers
      if: always()
      run: docker compose down
    - uses: actions/upload-artifact@v5
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30

  release:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci
      - run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
